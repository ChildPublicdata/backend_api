# [이 파일이 왜 필요한가]
# Gradle 빌드 자체의 동작 옵션을 지정하는 파일. build.gradle이 "무엇을 빌드할지"라면
# 여기는 "빌드를 어떤 환경/조건으로 돌릴지"를 정하는 곳.
#
# [주의] 여기에 org.gradle.java.home=C:/... 같은 내 컴퓨터 전용 경로를 적으면 안 됨.
# 이 파일은 git에 커밋돼서 Railway(리눅스) 서버로도 그대로 올라가는데,
# 리눅스에는 그런 윈도우 경로가 없어서 빌드가 바로 실패함.
# 내 컴퓨터에서만 JDK 경로를 강제하고 싶으면 커밋되지 않는 사용자 전용 파일에 적을 것:
#   C:\Users\<사용자명>\.gradle\gradle.properties
# (보통은 JAVA_HOME 환경변수만 JDK 17로 잡혀 있으면 이 설정 자체가 필요 없음)

# 빌드 중 메모리 부족을 막기 위한 Gradle 데몬 힙 크기
org.gradle.jvmargs=-Xmx1g
