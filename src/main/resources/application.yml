# 스프링부트 앱의 설정 파일. 여기 있는 값들은 앱이 시작될 때 읽어들여서 사용됨
# [이 파일이 왜 필요한가]
# 스프링부트 앱의 환경 설정 파일. DB 접속 정보, 서버 포트, CORS 허용 주소처럼
# "환경(로컬/Railway)마다 달라질 수 있는 값"을 코드에 하드코딩하지 않고 한곳에 모아두는 용도.
# 실제 값은 대부분 환경변수(${...})로 받아서, 로컬/Railway에서 서로 다른 값을 넣어도 코드는 그대로 재사용 가능.
spring:
  application:
    name: demo
  datasource:
    # DB 접속 주소. ${PGHOST}처럼 ${...}는 "환경변수(env var)에서 값을 가져온다"는 뜻.
    # 즉 코드에는 실제 주소/비밀번호를 적지 않고, 서버(로컬 또는 Railway)에 설정된 환경변수 값을 그대로 사용함
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      # validate = "테이블을 직접 만들지는 말고, 엔티티 구조와 실제 DB 구조가 맞는지 검사만 해라".
      # 테이블 생성/변경은 Flyway(db/migration/*.sql)가 전담하고, Hibernate는 검사만 맡는 역할 분담.
      # 둘이 어긋나면 앱이 아예 안 뜨기 때문에, 잘못된 상태로 서비스가 돌아가는 걸 막아줌.
      ddl-auto: validate
    # true로 하면 트랜잭션이 뷰 렌더링까지 열려있어서 성능 문제가 될 수 있어 false로 끔 (스프링 권장 설정)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # DB에 데이터를 저장할 때 한 건씩이 아니라 100건씩 묶어서 보내 속도를 높임 (DataSeeder가 수천 건 넣을 때 유용)
          batch_size: 100
        # insert 쿼리를 순서대로 정렬해서 배치 처리가 더 잘 되게 해주는 옵션
        order_inserts: true

server:
  # 서버가 열리는 포트. Railway 등 클라우드는 자체적으로 PORT 환경변수를 주입해주기 때문에
  # 그 값이 있으면 그걸 쓰고, 없으면(로컬 실행) 기본값 8080을 사용
  port: ${PORT:8080}
  error:
    # [왜 켜나] 스프링은 기본적으로 에러 응답 JSON의 message 필드를 빈 문자열로 비워둠.
    # 그러면 프론트 입장에서 400을 받아도 "반경은 10m 이상이어야 합니다" 같은 이유를 알 수 없어서
    # 원인을 서버 로그 없이는 못 찾음. 이 옵션을 켜면 그 사유 문구가 응답에 담김.
    include-message: always
    # [왜 켜나] 위의 include-message만 켜면 검증 실패 시 message가
    # "Validation failed for object='safeZoneRequest'. Error count: 1" 처럼 두루뭉술하게만 나와서
    # 프론트가 "어느 필드가 왜 틀렸는지"를 알 수 없음. 이 옵션을 켜면 응답에 errors 배열이 추가되고
    # 그 안에 필드명과 우리가 적어둔 사유("반경은 10m 이상이어야 합니다")가 함께 들어감.
    include-binding-errors: always

app:
  cors:
    # 프론트엔드(브라우저)에서 이 서버로 API 요청을 허용할 주소.
    # 환경변수 CORS_ALLOWED_ORIGINS가 없으면 기본값으로 로컬 개발 서버 주소(localhost:5173)를 허용
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
