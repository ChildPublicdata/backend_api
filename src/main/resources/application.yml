# 스프링부트 앱의 설정 파일. 여기 있는 값들은 앱이 시작될 때 읽어들여서 사용됨
# [이 파일이 왜 필요한가]
# 스프링부트 앱의 환경 설정 파일. DB 접속 정보, 서버 포트, CORS 허용 주소처럼
# "환경(로컬/Railway)마다 달라질 수 있는 값"을 코드에 하드코딩하지 않고 한곳에 모아두는 용도.
# 실제 값은 대부분 환경변수(${...})로 받아서, 로컬/Railway에서 서로 다른 값을 넣어도 코드는 그대로 재사용 가능.
spring:
  application:
    name: demo
  datasource:
    # DB 접속 주소. ${PGHOST}처럼 ${...}는 "환경변수(env var)에서 값을 가져온다"는 뜻.
    # 즉 코드에는 실제 주소/비밀번호를 적지 않고, 서버(로컬 또는 Railway)에 설정된 환경변수 값을 그대로 사용함
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      # DB 테이블을 자바 @Entity 클래스 구조에 맞춰 자동으로 만들고/수정해주는 옵션
      # (운영 서비스가 커지면 위험할 수 있어서 나중엔 Flyway 같은 마이그레이션 도구로 바꾸는 걸 추천)
      ddl-auto: update
    # true로 하면 트랜잭션이 뷰 렌더링까지 열려있어서 성능 문제가 될 수 있어 false로 끔 (스프링 권장 설정)
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # DB에 데이터를 저장할 때 한 건씩이 아니라 100건씩 묶어서 보내 속도를 높임 (DataSeeder가 수천 건 넣을 때 유용)
          batch_size: 100
        # insert 쿼리를 순서대로 정렬해서 배치 처리가 더 잘 되게 해주는 옵션
        order_inserts: true

server:
  # 서버가 열리는 포트. Railway 등 클라우드는 자체적으로 PORT 환경변수를 주입해주기 때문에
  # 그 값이 있으면 그걸 쓰고, 없으면(로컬 실행) 기본값 8080을 사용
  port: ${PORT:8080}

app:
  cors:
    # 프론트엔드(브라우저)에서 이 서버로 API 요청을 허용할 주소.
    # 환경변수 CORS_ALLOWED_ORIGINS가 없으면 기본값으로 로컬 개발 서버 주소(localhost:5173)를 허용
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
