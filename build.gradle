// [이 파일이 왜 필요한가]
// Gradle 빌드 설정 파일. "이 프로젝트를 빌드/실행하려면 어떤 플러그인과 라이브러리가 필요한지"를 정의함.
// 새 기능(DB 연동, Swagger 등)을 쓰려면 여기에 의존성을 먼저 추가해야 코드에서 해당 라이브러리를 쓸 수 있음.
plugins {
	id 'java'
	// 스프링부트 프로젝트를 빌드/실행할 수 있게 해주는 플러그인
	id 'org.springframework.boot' version '3.5.16'
	// build.gradle에 버전을 일일이 안 적어도 스프링부트가 호환되는 버전을 알아서 맞춰주는 플러그인
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// 이 프로젝트를 빌드할 때 사용할 자바 버전 (Railway 빌드 환경이 21을 기본 제공해서 맞춤)
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// 아래 dependencies(라이브러리)들을 어디서 다운로드할지 지정 (Maven 중앙 저장소)
	mavenCentral()
}

// 이 프로젝트가 필요로 하는 외부 라이브러리(의존성) 목록
dependencies {
	// REST API(컨트롤러) 만들 때 필요한 웹 서버 기능 (내장 톰캣 포함)
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// DB에 데이터를 저장/조회하기 위한 JPA(자바 ORM) 기능. Repository, @Entity 등을 쓸 수 있게 해줌
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 요청 DTO에 붙인 @NotNull, @Min 같은 검증 어노테이션을 실제로 동작시켜주는 라이브러리.
	// 이게 없으면 어노테이션을 달아도 조용히 무시돼서, 잘못된 값(빈 위도, 음수 반경)이 그대로 DB까지 들어감
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Swagger UI(API 명세 자동 문서화) 기능. 추가만 하면 /swagger-ui.html 이 자동으로 생김
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
	// 위험구역/격자/시설의 좌표를 JTS Point로 다루고 PostGIS(geometry, GIST 인덱스)와 매핑하기 위한 확장.
	// 버전을 명시하지 않은 이유: 스프링부트가 관리하는 hibernate-core와 같은 배포판(release train)에 속해 있어서
	// 버전을 맞춰 자동으로 골라줌(다르면 클래스 호환성 문제가 생길 수 있음)
	implementation 'org.hibernate.orm:hibernate-spatial'
	// Point/Polygon 같은 지리 좌표 타입(JTS)의 자바 구현체. hibernate-spatial이 내부적으로 이 타입을 사용함
	implementation 'org.locationtech.jts:jts-core:1.20.0'
	// AI 설명 API에서 LLM을 호출할 때 쓰는 비동기 HTTP 클라이언트(WebClient)를 쓰기 위함.
	// 이 프로젝트는 MVC(톰캣) 기반이지만, spring-boot-starter-web이 이미 있으면 스프링부트가
	// 서버는 그대로 서블릿(톰캣)으로 띄우고 WebClient만 추가로 쓸 수 있게 해줌
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// 부모/자녀 회원가입-로그인 기능에 필요. BCryptPasswordEncoder(비밀번호 해시)와
	// SecurityFilterChain(요청마다 인증 여부를 걸러주는 필터 체인)을 제공함
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 로그인 성공 시 발급하는 JWT(자기 안에 userId/role을 담고 서명된 토큰)를 만들고 검증하기 위한 라이브러리.
	// api는 코드에서 직접 쓰는 인터페이스, impl/jackson은 실행 시점에만 필요해서 runtimeOnly로 둠
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	// DB 스키마(테이블 구조) 변경 이력을 SQL 파일로 관리하는 도구.
	// 이게 없으면 Hibernate가 엔티티를 보고 테이블을 알아서 고치는데(ddl-auto: update),
	// 그 방식은 컬럼을 추가만 할 뿐 삭제/이름변경을 못 해서 코드와 DB 구조가 조용히 어긋남.
	implementation 'org.flywaydb:flyway-core'
	// Flyway 10부터 DB 종류별 지원이 별도 모듈로 분리됨 -> Postgres용 모듈을 따로 추가해야 함
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// PostgreSQL DB에 접속하기 위한 드라이버. 코드에서 직접 쓰진 않고 실행 시점에만 필요해서 runtimeOnly
	runtimeOnly 'org.postgresql:postgresql'
	// 로컬 테스트용 인메모리 DB(H2). developmentOnly라서 ./gradlew bootRun 으로 로컬 실행할 때만 쓰이고
	// 실제 배포(빌드된 jar)에는 포함되지 않음 -> Railway에서는 그대로 Postgres를 사용
	developmentOnly 'com.h2database:h2'
	// 테스트 코드 작성 시 필요한 라이브러리 (JUnit 등)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// [중요] developmentOnly는 테스트 실행에는 적용되지 않아서, 위의 H2가 있어도 테스트에서는 못 씀.
	// 이게 없으면 테스트가 Postgres 접속정보(PGHOST 등)를 찾다가 실패함 -> 별도로 한 번 더 선언
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	// 테스트를 JUnit 5 플랫폼으로 실행하겠다는 설정
	useJUnitPlatform()
}

// [왜 필요한가] 스프링부트 그래들 플러그인은 기본적으로 jar를 2개 만듦:
//   demo-0.0.1-SNAPSHOT.jar        <- 실행 가능한 진짜 배포용 (내장 톰캣+라이브러리 전부 포함)
//   demo-0.0.1-SNAPSHOT-plain.jar  <- 내 코드만 든 껍데기 (라이브러리가 없어서 단독 실행 불가)
// Railway는 기본 실행 명령이 `java -jar build/libs/*.jar` 라서 jar가 2개면 어느 걸 띄울지 모호해지고,
// 잘못하면 실행 불가능한 plain.jar를 잡아서 배포가 실패함. 그래서 plain jar 생성을 꺼둠.
tasks.named('jar') {
	enabled = false
}
